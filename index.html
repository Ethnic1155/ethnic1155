<!DOCTYPE html>
<html>
<head>
    <title>Amit Saree Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }
        header {
            background: #ff3f6c;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
            width: 220px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        img {
            width: 100%;
            border-radius: 10px;
        }
        button {
            background: #ff3f6c;
            color: white;
            border: none;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>Amit Saree Collection</h1>
</header>

<div class="container">

    <div class="card">
        <img src="https://via.placeholder.com/200">
        <h3>Silk Saree</h3>
        <p>Price: ₹999</p>
        <button onclick="copyText('Silk Saree - ₹999')">Copy Details</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200">
        <h3>Designer Saree</h3>
        <p>Price: ₹1299</p>
        <button onclick="copyText('Designer Saree - ₹1299')">Copy Details</button>
    </div>

</div>

<script>
function copyText(text) {
    navigator.clipboard.writeText(text);
    alert("Copied: " + text);
}
</script>

</body>
</html>
