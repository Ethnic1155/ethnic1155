<!DOCTYPE html>
<html>
<head>
    <title>Amit Saree Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f2f2f2;
        }

        header {
            background: #ff3f6c;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
        }

        .price {
            color: green;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #ff3f6c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #e6325c;
        }
    </style>
</head>

<body>

<header>
    <h1>Amit Saree Collection</h1>
</header>

<div class="container">

    <div class="card">
        <img src="https://via.placeholder.com/300">
        <div class="card-body">
            <div class="title">Silk Purple Saree</div>
            <div class="price">₹999</div>
            <button onclick="copyText('Silk Purple Saree | Price ₹999 | Premium Quality')">
                Copy Details
            </button>
        </div>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/300">
        <div class="card-body">
            <div class="title">Designer Red Saree</div>
            <div class="price">₹1299</div>
            <button onclick="copyText('Designer Red Saree | Price ₹1299 | Party Wear')">
                Copy Details
            </button>
        </div>
    </div>

</div>

<script>
function copyText(text) {
    navigator.clipboard.writeText(text);
    alert("Copied: " + text);
}
</script>

</body>
</html>
